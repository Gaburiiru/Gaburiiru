<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" aria-hidden="true">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#05d9e8"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="g" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line)" filter="url(#g)"/>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#line)"/>
</svg>
