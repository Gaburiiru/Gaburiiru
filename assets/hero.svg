<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Gabriel Ricardes, Front-end y Android developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0316"/>
      <stop offset="0.7" stop-color="#1c0638"/>
      <stop offset="1" stop-color="#2a0848"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f002"/>
      <stop offset="0.45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#05d9e8" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="stripes">
      <rect x="0" y="0" width="1200" height="420" fill="#fff"/>
      <rect x="0" y="200" width="1200" height="3" fill="#000"/>
      <rect x="0" y="218" width="1200" height="5" fill="#000"/>
      <rect x="0" y="238" width="1200" height="7" fill="#000"/>
      <rect x="0" y="258" width="1200" height="9" fill="#000"/>
      <rect x="0" y="276" width="1200" height="12" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="290"/></clipPath>
    <clipPath id="belowHorizon"><rect x="0" y="290" width="1200" height="130"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nameGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feFlood flood-color="#05d9e8" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <style>
    @font-face { font-family: 'OrbitronEmb'; font-weight: 900; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'ShareTechEmb'; src: url(data:font/woff2;base64,) format('woff2'); }
    .mono { font-family: 'ShareTechEmb', 'Consolas', monospace; }
    .title { font-family: 'OrbitronEmb', 'Arial Black', sans-serif; font-weight: 900; }

    .star { fill: #e8e2ff; animation: twinkle 3s ease-in-out infinite; }
    .star:nth-child(2n) { animation-delay: 1s; }
    .star:nth-child(3n) { animation-delay: 2s; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .halo { animation: pulse 4s ease-in-out infinite; transform-origin: 600px 200px; }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: .8; transform: scale(1.06); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .g-cyan { fill: #05d9e8; animation: gc 5s infinite steps(1); }
    .g-mag  { fill: #ff2bd6; animation: gm 5s infinite steps(1); }
    @keyframes gc {
      0%, 100% { transform: translate(-3px, 0); clip-path: none; }
      90% { transform: translate(-9px, 2px); clip-path: inset(10% 0 55% 0); }
      92% { transform: translate(6px, -2px); clip-path: inset(60% 0 8% 0); }
      94% { transform: translate(-3px, 0); clip-path: none; }
    }
    @keyframes gm {
      0%, 100% { transform: translate(3px, 0); clip-path: none; }
      90% { transform: translate(9px, -2px); clip-path: inset(50% 0 20% 0); }
      92% { transform: translate(-6px, 2px); clip-path: inset(5% 0 70% 0); }
      94% { transform: translate(3px, 0); clip-path: none; }
    }
    .g-white { animation: gw 5s infinite steps(1); }
    @keyframes gw { 0%, 100% { transform: none; } 91% { transform: translate(2px, 0) skewX(-6deg); } 93% { transform: none; } }

  </style>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <g>
    <circle class="star" cx="80" cy="60" r="1.6"/>
    <circle class="star" cx="190" cy="140" r="1.2"/>
    <circle class="star" cx="300" cy="40" r="1.4"/>
    <circle class="star" cx="420" cy="110" r="1"/>
    <circle class="star" cx="760" cy="50" r="1.5"/>
    <circle class="star" cx="880" cy="130" r="1.1"/>
    <circle class="star" cx="990" cy="70" r="1.6"/>
    <circle class="star" cx="1110" cy="150" r="1.2"/>
    <circle class="star" cx="1150" cy="40" r="1"/>
    <circle class="star" cx="40" cy="200" r="1.1"/>
    <circle class="star" cx="1060" cy="230" r="1.3"/>
    <circle class="star" cx="140" cy="250" r="1"/>
  </g>

  <circle class="halo" cx="600" cy="200" r="150" fill="#ff2bd6" filter="url(#sunGlow)" clip-path="url(#aboveHorizon)"/>
  <circle cx="600" cy="200" r="140" fill="url(#sun)" mask="url(#stripes)" clip-path="url(#aboveHorizon)"/>

  <rect x="0" y="290" width="1200" height="130" fill="#0a0316"/>
  <g clip-path="url(#belowHorizon)" stroke="url(#floor)" stroke-width="1.5" fill="none">
    <line x1="600" y1="290" x2="-900" y2="420"/>
    <line x1="600" y1="290" x2="-500" y2="420"/>
    <line x1="600" y1="290" x2="-150" y2="420"/>
    <line x1="600" y1="290" x2="150" y2="420"/>
    <line x1="600" y1="290" x2="400" y2="420"/>
    <line x1="600" y1="290" x2="600" y2="420"/>
    <line x1="600" y1="290" x2="800" y2="420"/>
    <line x1="600" y1="290" x2="1050" y2="420"/>
    <line x1="600" y1="290" x2="1350" y2="420"/>
    <line x1="600" y1="290" x2="1700" y2="420"/>
    <line x1="600" y1="290" x2="2100" y2="420"/>
    <g>
      <line x1="0" y1="292" x2="1200" y2="292"/>
      <line x1="0" y1="298" x2="1200" y2="298"/>
      <line x1="0" y1="308" x2="1200" y2="308"/>
      <line x1="0" y1="322" x2="1200" y2="322"/>
      <line x1="0" y1="342" x2="1200" y2="342"/>
      <line x1="0" y1="370" x2="1200" y2="370"/>
      <line x1="0" y1="408" x2="1200" y2="408"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 6" dur="0.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <line x1="0" y1="290" x2="1200" y2="290" stroke="#ff2bd6" stroke-width="2" filter="url(#glow)"/>

  <text class="mono" x="60" y="56" font-size="18" fill="#05d9e8" letter-spacing="3">[ 00 ] DEV FRONT-END &amp; ANDROID · BUENOS AIRES, AR</text>
  <text class="mono" x="1140" y="56" font-size="18" fill="#39ff88" text-anchor="end" letter-spacing="2">● ONLINE<tspan class="cursor">_</tspan></text>

  <g filter="url(#nameGlow)">
    <text class="title g-cyan" x="600" y="226" font-size="76" text-anchor="middle" textLength="1010" lengthAdjust="spacingAndGlyphs" opacity="0.9">GABRIEL RICARDES</text>
    <text class="title g-mag" x="600" y="226" font-size="76" text-anchor="middle" textLength="1010" lengthAdjust="spacingAndGlyphs" opacity="0.9">GABRIEL RICARDES</text>
  </g>
  <text class="title g-white" x="600" y="226" font-size="76" text-anchor="middle" textLength="1010" lengthAdjust="spacingAndGlyphs" fill="#ffffff">GABRIEL RICARDES</text>

  <text class="mono" x="600" y="370" font-size="22" text-anchor="middle" fill="#e8e2ff" letter-spacing="4">REACT · VUE · TYPESCRIPT · KOTLIN · JETPACK COMPOSE</text>
</svg>
